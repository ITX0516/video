name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# The Android project lives under ShortFeed/; run Gradle from there.
defaults:
  run:
    working-directory: ShortFeed

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu runner ships a preinstalled Android SDK ($ANDROID_HOME) with recent
      # platforms + accepted licenses. Re-accept licenses defensively; AGP auto-downloads
      # anything still missing. (We avoid android-actions/setup-android@v3 here: it shells
      # out to `sdkmanager tools`, but the `tools` package was removed from the SDK repo,
      # so that action currently exits non-zero and breaks the build.)
      - name: Accept Android SDK licenses
        run: |
          SM="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$(command -v sdkmanager || true)"
          [ -n "$SM" ] && yes | "$SM" --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Report APK
        run: ls -lh app/build/outputs/apk/debug/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: ShortFeed-debug
          path: ShortFeed/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
