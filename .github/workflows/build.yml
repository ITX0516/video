name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# The Android project lives under ShortFeed/; run Gradle from there.
defaults:
  run:
    working-directory: ShortFeed

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # AGP 8.7 + compileSdk 35 need a working Android SDK with accepted licenses.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Report APK
        run: ls -lh app/build/outputs/apk/debug/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShortFeed-debug
          path: ShortFeed/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
